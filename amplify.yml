version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --cache .npm --prefer-offline
        - env | grep -E '^(NEXT_PUBLIC_|YOUTUBE_API_KEY=|SUPABASE_SECRET_KEY=|DATABASE_URL=|R2_)' >> .env.production
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
